[custom]
;subconverter 外部配置，通过 config 参数引用

;局域网
ruleset=DIRECT,[]DOMAIN-SUFFIX,local
ruleset=DIRECT,[]IP-CIDR,0.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,100.64.0.0/10,no-resolve
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,169.254.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.0.0.0/24,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.0.2.0/24,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,224.0.0.0/4,no-resolve
ruleset=DIRECT,[]IP-CIDR6,::1/128,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fc00::/7,no-resolve
ruleset=DIRECT,[]IP-CIDR6,fe80::/10,no-resolve

;AI 服务
ruleset=Claude,[]DOMAIN-KEYWORD,claude
ruleset=Claude,[]DOMAIN-KEYWORD,anthropic
ruleset=Claude,[]DOMAIN-SUFFIX,clau.de
ruleset=OpenAI,[]DOMAIN-KEYWORD,chatgpt
ruleset=OpenAI,[]DOMAIN-KEYWORD,openai

;远程规则
ruleset=Claude,https://magicrule.pages.dev/data/_shared/artifacts/Anthropic_rules_f9e0decc2657fdcd.list
ruleset=DIRECT,https://raw.githubusercontent.com/7ongOrz/QuantumultX/main/Rule/PT.list
ruleset=DIRECT,https://magicrule.pages.dev/data/_shared/artifacts/Direct_rules_471bc079c5184e1f.list
ruleset=AdBlock,https://magicrule.pages.dev/data/_shared/artifacts/Advertising_rules_1b4972ff6ce10d00.list
ruleset=美国节点,https://magicrule.pages.dev/data/_shared/artifacts/GoogleVoice_rules_7e2a5efa51b704e2.list
ruleset=Oracle,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Oracle/Oracle.list
ruleset=OpenAI,https://magicrule.pages.dev/data/_shared/artifacts/OpenAI_rules_f362ba1006ae0e0c.list
ruleset=手动切换,https://magicrule.pages.dev/data/_shared/artifacts/Gemini_rules_8da136e527c6fa11.list
ruleset=巴哈姆特,https://magicrule.pages.dev/data/_shared/artifacts/Bahamut_rules_1067f2a62bd91722.list
ruleset=哔哩哔哩,https://magicrule.pages.dev/data/_shared/artifacts/BiliBili_rules_2465ea6448cc4fe0.list
ruleset=Emby,https://raw.githubusercontent.com/7ongOrz/QuantumultX/main/Rule/Emby_loon.list
ruleset=国际媒体,https://magicrule.pages.dev/data/_shared/artifacts/GlobalMedia_rules_cbbbcb6dca56af83.list
ruleset=苹果服务,https://magicrule.pages.dev/data/_shared/artifacts/Apple_rules_50be57f093bd1fff.list
ruleset=游戏平台,https://magicrule.pages.dev/data/_shared/artifacts/GlobalGame_rules_d8c6da812d5e7f0b.list
ruleset=微软服务,https://magicrule.pages.dev/data/_shared/artifacts/Microsoft_rules_7fd3d40967dabeef.list
ruleset=Telegram,https://magicrule.pages.dev/data/_shared/artifacts/Telegram_rules_4acef626d1aec7ca.list
ruleset=国外网站,https://magicrule.pages.dev/data/_shared/artifacts/Global_rules_b5f3bb33d8a4698a.list
ruleset=国内网站,https://magicrule.pages.dev/data/_shared/artifacts/China_rules_25adbc0394103807.list
ruleset=国内网站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaDNS/ChinaDNS.list

;兜底规则
ruleset=国内网站,[]GEOIP,CN,no-resolve
ruleset=漏网之鱼,[]FINAL

;策略组
custom_proxy_group=手动切换`select`.*
custom_proxy_group=哔哩哔哩`select`[]DIRECT`[]手动切换`[]香港节点`[]台湾节点`[]低倍节点
custom_proxy_group=Emby`select`[]DIRECT`[]手动切换`[]低倍节点`[]香港节点`[]台湾节点`[]日本节点`[]美国节点`[]韩国节点`[]狮城节点
custom_proxy_group=低倍节点`select`(?<![0-9.])0\.2(?![0-9.])
custom_proxy_group=巴哈姆特`select`[]手动切换`[]低倍节点`[]香港节点`[]台湾节点
custom_proxy_group=国际媒体`select`[]手动切换`[]低倍节点`[]香港节点`[]台湾节点`[]日本节点`[]美国节点`[]韩国节点`[]狮城节点
custom_proxy_group=游戏平台`select`[]手动切换`[]DIRECT`[]香港节点`[]日本节点`[]美国节点`[]台湾节点`[]韩国节点`[]狮城节点
custom_proxy_group=苹果服务`select`[]DIRECT`[]手动切换`[]香港节点`[]日本节点`[]美国节点`[]台湾节点`[]韩国节点`[]狮城节点
custom_proxy_group=微软服务`select`[]DIRECT`[]手动切换`[]香港节点`[]日本节点`[]美国节点`[]台湾节点`[]韩国节点`[]狮城节点
custom_proxy_group=Claude`select`^(?=.*(?:美|US|🇺🇸|(?i:States)|(?i:American)))(?!.*(?:港|台|日|韩|新|狮|SG|(?i:Singapore)|0\.2)).*$
custom_proxy_group=OpenAI`select`[]手动切换`[]日本节点`[]香港节点`[]美国节点`[]台湾节点`[]韩国节点`[]狮城节点
custom_proxy_group=Oracle`select`[]DIRECT`[]手动切换`[]日本节点`[]香港节点`[]美国节点`[]台湾节点`[]韩国节点`[]狮城节点
custom_proxy_group=Telegram`select`[]手动切换`[]低倍节点`[]日本节点`[]香港节点`[]美国节点`[]台湾节点`[]韩国节点`[]狮城节点
custom_proxy_group=特殊节点`select`^(?!.*(?:港|台|日|韩|坡|美|狮|HK|US|TW|JP|KR|SG|Hong|Tai|Japan|Korea|Singapore|States|Traffic|Expire)).*$
custom_proxy_group=国外网站`select`[]手动切换`[]香港节点`[]日本节点`[]美国节点`[]台湾节点`[]韩国节点`[]狮城节点
custom_proxy_group=国内网站`select`[]DIRECT`[]手动切换`[]香港节点`[]日本节点`[]美国节点`[]台湾节点`[]韩国节点`[]狮城节点
custom_proxy_group=AdBlock`select`[]REJECT`[]DIRECT`[]手动切换
custom_proxy_group=漏网之鱼`select`[]手动切换`[]DIRECT`[]香港节点`[]日本节点`[]美国节点`[]台湾节点`[]韩国节点`[]狮城节点
custom_proxy_group=香港节点`url-test`^(?=.*(?:港|HK|🇭🇰|(?i:Hong)))(?!.*(?:台|日|韩|新|美|狮|0\.2)).*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=日本节点`url-test`^(?=.*(?:日|JP|🇯🇵|(?i:Japan)))(?!.*(?:港|台|韩|新|美|狮|0\.2|尼)).*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=台湾节点`url-test`^(?=.*(?:台|TW|🇹🇼|(?i:Taiwan)))(?!.*(?:港|日|韩|新|美)).*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=韩国节点`url-test`^(?=.*(?:韩|韓|朝|KR|🇰🇷|(?i:Korea)))(?!.*(?:港|台|日|新|美)).*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=美国节点`url-test`^(?=.*(?:美|US|🇺🇸|(?i:States)|(?i:American)))(?!.*(?:港|台|日|韩|新|0\.2)).*$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=狮城节点`url-test`^(?=.*(?:新|狮|獅|SG|🇸🇬|(?i:Singapore)))(?!.*(?:港|台|日|韩|美|0\.2)).*$`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
